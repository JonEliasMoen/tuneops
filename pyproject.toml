[project]
name = "tuneops"
version = "0.1.0"
requires-python = ">=3.12,<=3.15.2"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "cryptography>=46,<51",
    "fastapi>=0.141,<1",
    "google-auth>=2.41,<3",
    "musicbrainzngs>=0.7.1,<1",
    "mcp>=2.3,<3",
    "Pillow>=10,<13",
    "pylast>=7.1,<8",
    "requests>=2.32,<3",
    "spotipy>=2.25,<3",
    "tidalapi>=0.8.3,<1",
    "truststore>=0.10,<1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.41,<1",
]
[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.music_tools.tracklist" = ["THIRD_PARTY_LICENSE.md"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"
